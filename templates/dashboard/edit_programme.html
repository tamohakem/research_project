{% extends 'base.html' %}

{% block title %}Edit Programme - {{ programme.code }}{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Programme: {{ programme.code }}</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Degree Type *</label>
                        <select name="degree_type" class="form-select" required>
                            {% for code, label in degree_choices %}
                                <option value="{{ code }}" {% if programme.degree_type == code %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Programme Name *</label>
                        <input type="text" name="name" class="form-control" value="{{ programme.name }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Option/Specialization</label>
                        <input type="text" name="option_name" class="form-control" value="{{ programme.option_name }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Duration (years) *</label>
                        <input type="number" name="duration_years" step="0.5" class="form-control" value="{{ programme.duration_years }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label>Payment Status *</label>
                        <select name="payment_status" class="form-select" required>
                            {% for code, label in payment_choices %}
                                <option value="{{ code }}" {% if programme.payment_status == code %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Total Credits Required</label>
                        <input type="number" name="total_credits" class="form-control" value="{{ programme.total_credits_required }}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="form-check mt-4">
                            <input type="checkbox" name="is_top_up" class="form-check-input" id="is_top_up" {% if programme.is_top_up %}checked{% endif %}>
                            <label class="form-check-label" for="is_top_up">This is a Top-up Programme</label>
                        </div>
                        <div class="form-check mt-2">
                            <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if programme.is_active %}checked{% endif %}>
                            <label class="form-check-label" for="is_active">Programme is Active</label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label>Entry Requirements</label>
                    <textarea name="entry_requirements" class="form-control" rows="3">{{ programme.entry_requirements }}</textarea>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{% url 'dashboard:programme_details' programme.id %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
