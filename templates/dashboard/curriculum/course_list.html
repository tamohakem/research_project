<!DOCTYPE html>
<html>
<head>
    <title>Courses - FET Academic System</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #003366; color: white; }
        tr:nth-child(even) { background: #f2f2f2; }
        .btn { background: #003366; color: white; padding: 10px; text-decoration: none; display: inline-block; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Course List</h1>
    <a href="/dashboard" class="btn">Back to Dashboard</a>
    
    <table>
        <thead>
            <tr><th>Code</th><th>Title</th><th>Credits</th><th>Status</th></tr>
        </thead>
        <tbody>
            {% for cp in page_obj %}
            <tr>
                <td>{{ cp.course.code }}</td>
                <td>{{ cp.course.title }}</td>
                <td>{{ cp.course.credits }}</td>
                <td>{{ cp.course.status_type }}</td>
            </tr>
            {% empty %}
                <tr><td colspan="4">No courses found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
