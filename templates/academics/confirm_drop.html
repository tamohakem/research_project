{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header bg-danger text-white">
            <h4>Confirm Drop Course</h4>
        </div>
        <div class="card-body text-center">
            <p>Are you sure you want to drop <strong>{{ course_code }}</strong>?</p>
            <p class="text-danger">⚠️ This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Drop Course</button>
                <a href="{% url 'academics:student_hub' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
