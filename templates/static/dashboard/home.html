{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card bg-primary text-white mb-4">
            <div class="card-body">
                <h3>Welcome, {{ user.get_full_name|default:user.username }}!</h3>
                <p>Your academic dashboard</p>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header">
                <h5>Your CGPA</h5>
            </div>
            <div class="card-body text-center">
                <h1 class="display-1">{{ cgpa }}</h1>
                <p>{{ classification }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header">
                <h5>Quick Actions</h5>
            </div>
            <div class="card-body">
                <a href="{% url 'academics:marks_entry' %}" class="btn btn-primary w-100 mb-2">Enter Marks</a>
                <a href="{% url 'curriculum:course_list' %}" class="btn btn-outline-primary w-100">View Courses</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
