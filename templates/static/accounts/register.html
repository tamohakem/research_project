{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4>Register</h4>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="border rounded p-3 mb-3">
                        <label class="form-label fw-bold">Or snap your face photo with your webcam</label>
                        <video id="faceCamera" class="w-100 rounded bg-dark" autoplay playsinline style="display: none; max-height: 260px; object-fit: cover;"></video>
                        <canvas id="faceCanvas" style="display: none;"></canvas>
                        <img id="facePreview" class="w-100 rounded" alt="Captured face preview" style="display: none; max-height: 260px; object-fit: cover;">
                        <div class="d-flex gap-2 mt-2 flex-wrap">
                            <button type="button" class="btn btn-outline-primary btn-sm" id="startCameraBtn">Start Camera</button>
                            <button type="button" class="btn btn-outline-success btn-sm" id="captureFaceBtn" style="display: none;">Snap Photo</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="retakeFaceBtn" style="display: none;">Retake</button>
                        </div>
                        <small class="text-muted" id="cameraStatus"></small>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                <p class="mt-3 text-center">
                    Already have an account? <a href="{% url 'accounts:login' %}">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script>
const video = document.getElementById('faceCamera');
const canvas = document.getElementById('faceCanvas');
const preview = document.getElementById('facePreview');
const startBtn = document.getElementById('startCameraBtn');
const captureBtn = document.getElementById('captureFaceBtn');
const retakeBtn = document.getElementById('retakeFaceBtn');
const statusText = document.getElementById('cameraStatus');
const capturedInput = document.getElementById('id_captured_face_image');
const uploadInput = document.getElementById('id_profile_photo');
let stream = null;

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }
}

async function startCamera() {
    try {
        stopCamera();
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        video.srcObject = stream;
        video.style.display = 'block';
        preview.style.display = 'none';
        captureBtn.style.display = 'inline-block';
        retakeBtn.style.display = 'none';
        statusText.textContent = '';
    } catch (error) {
        statusText.textContent = 'Camera could not be started. You can still upload a photo.';
    }
}

function captureFace() {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const imageData = canvas.toDataURL('image/jpeg', 0.92);
    capturedInput.value = imageData;
    preview.src = imageData;
    preview.style.display = 'block';
    video.style.display = 'none';
    captureBtn.style.display = 'none';
    retakeBtn.style.display = 'inline-block';
    stopCamera();
    if (uploadInput) uploadInput.value = '';
}

startBtn.addEventListener('click', startCamera);
captureBtn.addEventListener('click', captureFace);
retakeBtn.addEventListener('click', startCamera);
if (uploadInput) {
    uploadInput.addEventListener('change', () => {
        if (uploadInput.files.length) capturedInput.value = '';
    });
}
</script>
{% endblock %}
