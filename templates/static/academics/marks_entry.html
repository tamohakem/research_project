{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h4>Enter Course Marks</h4>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <p>Marks entry form will be displayed here.</p>
            <p>Select academic year and semester, then enter CA and Exam marks.</p>
            <button type="submit" class="btn btn-primary">Save Marks</button>
        </form>
    </div>
</div>
{% endblock %}
