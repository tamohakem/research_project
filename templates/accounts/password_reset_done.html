{% extends 'base.html' %}

{% block title %}Reset Email Sent - FET Academic Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h2 class="h4 mb-3">Check your email</h2>
                <p class="text-muted">
                    If an account exists for the email address provided, a password reset link has been sent.
                </p>
                <a class="btn btn-outline-primary" href="{% url 'accounts:login' %}">Return to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
