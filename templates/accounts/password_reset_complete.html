{% extends 'base.html' %}

{% block title %}Password Updated - FET Academic Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h2 class="h4 mb-3">Password updated</h2>
                <p class="text-muted">
                    Your password has been reset successfully. You can now sign in using the new password.
                </p>
                <a class="btn btn-primary" href="{% url 'accounts:login' %}">Go to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
