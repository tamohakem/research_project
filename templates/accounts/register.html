<!DOCTYPE html>
<html>
<head>
    <title>Register - FET Academic System</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; }
        .container { max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; }
        button { background: #003366; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Registration</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="{% url 'accounts:login' %}">Login here</a></p>
        <p><a href="/">Back to Home</a></p>
    </div>
</body>
</html>
